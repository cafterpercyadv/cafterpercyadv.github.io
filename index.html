<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <title>Cafter Percy Advocacia Especializada - Previdenciário e Trabalhista em Nova Iguaçu</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        /* --- ESTILOS GERAIS --- */
        :root {
            --primary-dark: #0f172a;
            --gold-accent: #d4af37;
            --text-gray: #4b5563;
            --white: #ffffff;
            --bg-light: #f8fafc;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { scroll-behavior: smooth; }
        body { font-family: 'Lato', sans-serif; background-color: var(--white); color: var(--primary-dark); overflow-x: hidden; }
        h1, h2, h3, h4 { font-family: 'Playfair Display', serif; }
        a { text-decoration: none; }
        ul { list-style: none; }

        /* --- HEADER DARK (PREMIUM) --- */
        header { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            padding: 15px 5%; 
            background: var(--primary-dark); /* CORREÇÃO: Fundo Escuro */
            z-index: 100; 
            border-bottom: 1px solid rgba(255,255,255,0.1); 
            position: relative; 
        }

        .logo-container {
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        /* Ajustes para links no fundo escuro */
        nav ul { display: flex; gap: 30px; align-items: center; }
        
        nav a { 
            color: var(--white); /* CORREÇÃO: Texto Branco */
            font-weight: 600; 
            font-size: 0.9rem; 
            transition: 0.3s; 
        }
        nav a:hover { color: var(--gold-accent); }

        .btn-header { 
            background-color: var(--gold-accent); /* CORREÇÃO: Botão Dourado */
            color: var(--primary-dark); 
            padding: 10px 25px; 
            border-radius: 50px; 
            font-weight: 700; 
            font-size: 0.9rem; 
            transition: 0.3s; 
        }
        .btn-header:hover { 
            background-color: #fff; 
            transform: translateY(-2px); 
            box-shadow: 0 4px 10px rgba(212, 175, 55, 0.4); 
        }

        /* --- HERO --- */
        .hero { display: flex; align-items: center; justify-content: space-between; padding: 60px 5% 100px 5%; background: linear-gradient(135deg, #fff 50%, #fcfcfc 100%); flex-wrap: wrap; }
        .hero-content { flex: 1; max-width: 600px; padding-right: 40px; }
        .badge { display: inline-block; background: #fff8e1; color: #bfa15f; padding: 8px 16px; border-radius: 30px; font-size: 0.85rem; font-weight: 700; margin-bottom: 20px; border: 1px solid #fae6b1; }
        .hero h1 { font-size: 3.5rem; line-height: 1.1; color: var(--primary-dark); margin-bottom: 20px; }
        .hero h1 span { color: var(--gold-accent); }
        .hero p { color: var(--text-gray); font-size: 1.1rem; line-height: 1.6; margin-bottom: 35px; }
        .cta-group { display: flex; gap: 20px; margin-bottom: 50px; flex-wrap: wrap; }
        .btn-primary { background-color: var(--primary-dark); color: var(--white); padding: 15px 35px; border-radius: 8px; font-weight: 700; display: flex; align-items: center; gap: 10px; transition: 0.3s; cursor: pointer; border: none; }
        .btn-outline { background-color: transparent; color: var(--primary-dark); border: 2px solid #e5e7eb; padding: 15px 35px; border-radius: 8px; font-weight: 700; display: flex; align-items: center; gap: 10px; transition: 0.3s; cursor: pointer; }
        .btn-primary:hover { background-color: #1e293b; }
        .btn-outline:hover { border-color: var(--primary-dark); }
        .trust-icons { display: flex; gap: 40px; border-top: 1px solid #eee; padding-top: 30px; }
        .trust-item { text-align: center; }
        .trust-item i { display: block; font-size: 1.2rem; color: #9ca3af; margin-bottom: 8px; }
        .trust-item span { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 1px; color: #9ca3af; font-weight: 700; }
        .hero-image { flex: 1; position: relative; display: flex; justify-content: center; }
        .hero-image::before { content: ''; position: absolute; top: -20px; right: 40px; width: 100px; height: 100px; border-top: 5px solid var(--gold-accent); border-right: 5px solid var(--gold-accent); z-index: 0; }
        .image-wrapper { position: relative; z-index: 1; border-radius: 10px; overflow: hidden; box-shadow: 0 20px 40px rgba(0,0,0,0.1); max-width: 450px; }
        .image-wrapper img { width: 100%; display: block; }
        .floating-card { position: absolute; bottom: 30px; right: -20px; background: var(--white); padding: 15px 25px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.15); display: flex; align-items: center; gap: 15px; z-index: 2; }
        .check-circle { width: 35px; height: 35px; background: #dcfce7; color: #16a34a; border-radius: 50%; display: flex; align-items: center; justify-content: center; }
        .card-text strong { display: block; font-size: 0.9rem; color: var(--primary-dark); }
        .card-text span { font-size: 0.75rem; color: var(--text-gray); }

        /* --- TRIAGEM --- */
        .triage-section { background-color: var(--primary-dark); padding: 80px 5%; text-align: center; color: var(--white); }
        .triage-header h4 { color: var(--gold-accent); text-transform: uppercase; letter-spacing: 2px; font-size: 0.85rem; margin-bottom: 10px; }
        .triage-header h2 { font-size: 2.5rem; margin-bottom: 15px; }
        .triage-header p { color: #94a3b8; max-width: 600px; margin: 0 auto 50px auto; }
        .triage-container { background: var(--white); color: var(--primary-dark); max-width: 900px; margin: 0 auto; border-radius: 12px; padding: 40px; box-shadow: 0 25px 50px rgba(0,0,0,0.25); text-align: left; }
        .progress-header { display: flex; justify-content: space-between; margin-bottom: 30px; font-size: 0.8rem; font-weight: 700; color: var(--text-gray); border-bottom: 2px solid #f1f5f9; padding-bottom: 15px; }
        .step-indicator span { color: var(--gold-accent); }
        .question-title { font-size: 1.5rem; margin-bottom: 10px; }
        .question-subtitle { color: var(--text-gray); margin-bottom: 30px; display: block; }
        .options-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }
        .option-card { border: 2px solid #e2e8f0; border-radius: 10px; padding: 25px; cursor: pointer; transition: all 0.3s ease; }
        .option-card:hover { border-color: var(--primary-dark); transform: translateY(-5px); }
        .option-icon { font-size: 1.5rem; color: var(--primary-dark); margin-bottom: 15px; }
        .option-card h3 { font-size: 1.1rem; margin-bottom: 10px; font-weight: 700; }
        .option-card p { font-size: 0.85rem; color: var(--text-gray); line-height: 1.4; }

        /* --- ÁREAS DE ATUAÇÃO --- */
        .areas-section { padding: 100px 5%; background-color: var(--white); text-align: center; }
        .section-title { font-size: 2.5rem; color: var(--primary-dark); margin-bottom: 60px; display: inline-block; position: relative; }
        .section-title::after { content: ''; display: block; width: 60px; height: 3px; background-color: var(--gold-accent); margin: 15px auto 0 auto; }
        .areas-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 30px; max-width: 1200px; margin: 0 auto; }
        .area-card { background: #fff; border: 1px solid #f1f5f9; border-radius: 16px; padding: 40px 30px; text-align: left; transition: 0.3s; position: relative; }
        .area-card:hover { box-shadow: 0 20px 40px rgba(0,0,0,0.08); transform: translateY(-5px); }
        .area-card.highlight { border-top: 4px solid var(--gold-accent); box-shadow: 0 20px 40px rgba(0,0,0,0.05); }
        .tag-highlight { position: absolute; top: 20px; right: 20px; background: #fefce8; color: #854d0e; font-size: 0.7rem; font-weight: 800; padding: 5px 10px; border-radius: 4px; text-transform: uppercase; }
        .icon-box { width: 50px; height: 50px; background-color: var(--primary-dark); border-radius: 8px; display: flex; align-items: center; justify-content: center; margin-bottom: 25px; }
        .icon-box i { color: var(--gold-accent); font-size: 1.2rem; }
        .area-card h3 { font-size: 1.4rem; margin-bottom: 25px; color: var(--primary-dark); }
        .feature-list li { margin-bottom: 12px; font-size: 0.95rem; color: var(--text-gray); display: flex; align-items: center; gap: 10px; }
        .feature-list li::before { content: '✓'; color: var(--gold-accent); font-weight: bold; }

        /* --- A ESSÊNCIA --- */
        .about-section { padding: 80px 5%; background-color: #f8fafc; display: flex; align-items: center; justify-content: center; gap: 60px; }
        .about-image { flex: 1; max-width: 550px; position: relative; }
        .about-image img { width: 100%; border-radius: 12px; box-shadow: 0 20px 40px rgba(0,0,0,0.1); display: block; }
        .experience-badge { position: absolute; bottom: -20px; right: -20px; background-color: var(--primary-dark); color: var(--gold-accent); padding: 20px 30px; border-radius: 12px; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.2); }
        .experience-badge strong { display: block; font-size: 2rem; line-height: 1; font-family: 'Playfair Display', serif; }
        .experience-badge span { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 1px; color: #fff; }
        .about-content { flex: 1; max-width: 600px; }
        .about-content h2 { font-size: 2.5rem; margin-bottom: 25px; color: var(--primary-dark); }
        .about-content p { color: var(--text-gray); line-height: 1.7; margin-bottom: 20px; font-size: 1.05rem; }
        .mission-vision { display: grid; grid-template-columns: 1fr 1fr; gap: 30px; margin-top: 40px; padding-top: 30px; border-top: 1px solid #e2e8f0; }
        .mv-item h4 { font-size: 1.1rem; margin-bottom: 10px; color: var(--primary-dark); }
        .mv-item p { font-size: 0.9rem; margin-bottom: 0; }

        /* --- FAQ --- */
        .faq-section { padding: 100px 5%; background-color: var(--white); text-align: center; }
        .faq-container { max-width: 800px; margin: 0 auto; text-align: left; }
        .faq-item { margin-bottom: 15px; border: 1px solid #e2e8f0; border-radius: 8px; overflow: hidden; background: #fff; }
        .faq-question { padding: 20px 25px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; font-weight: 700; color: var(--primary-dark); transition: 0.3s; }
        .faq-question:hover { background-color: #f8fafc; color: var(--gold-accent); }
        .faq-question i { transition: transform 0.3s; color: #cbd5e1; }
        .faq-item.active .faq-question i { transform: rotate(180deg); color: var(--gold-accent); }
        .faq-answer { max-height: 0; overflow: hidden; transition: max-height 0.4s ease; background-color: #f8fafc; }
        .faq-answer p { padding: 25px; color: var(--text-gray); line-height: 1.6; font-size: 0.95rem; border-top: 1px solid #e2e8f0; }

        /* --- RODAPÉ REFINADO --- */
        footer {
            background-color: var(--primary-dark);
            color: #fff;
            padding: 60px 5% 30px 5%;
            border-top: 4px solid var(--gold-accent);
        }

        .footer-content {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            padding-bottom: 40px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            margin-bottom: 30px;
        }

        .footer-brand {
            max-width: 400px;
        }

        .footer-brand h2 {
            font-size: 1.8rem;
            letter-spacing: 1px;
            color: #fff;
            margin-bottom: 5px;
        }
        
        .footer-brand .sub-footer {
            font-size: 0.8rem;
            letter-spacing: 2px;
            color: var(--gold-accent);
            text-transform: uppercase;
            font-family: 'Lato', sans-serif;
            font-weight: 700;
            display: block;
            margin-bottom: 10px;
        }

        .footer-brand .loc-footer {
            font-size: 0.9rem;
            color: #94a3b8;
            line-height: 1.4;
        }

        .footer-social {
            display: flex;
            gap: 20px;
        }

        .footer-social a {
            color: #94a3b8;
            font-size: 1.4rem;
            transition: 0.3s;
            background: rgba(255,255,255,0.05);
            width: 45px;
            height: 45px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .footer-social a:hover {
            color: var(--gold-accent);
            background: rgba(255,255,255,0.1);
        }

        .footer-bottom {
            display: flex;
            justify-content: space-between;
            font-size: 0.8rem;
            color: #64748b;
        }

        /* --- BOTÃO FLUTUANTE WHATSAPP --- */
        .whatsapp-float {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background-color: #25d366;
            color: #fff;
            width: 60px;
